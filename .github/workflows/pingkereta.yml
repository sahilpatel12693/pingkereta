name: PingKereta standalone migration checks
on:
  pull_request:
    paths:
      - 'netlify/functions/pingkereta.js'
      - 'public/**'
      - 'tests/**'
      - 'scripts/**'
      - '.env.example'
      - 'netlify.toml'
      - 'package.json'
      - '.github/workflows/pingkereta.yml'
  push:
    branches: [main]
    paths:
      - 'netlify/functions/pingkereta.js'
      - 'public/**'
      - 'tests/**'
      - 'netlify.toml'
      - 'package.json'
      - 'scripts/**'
      - '.env.example'
permissions:
  contents: read
jobs:
  pingkereta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax validation
        run: |
          node --check netlify/functions/pingkereta.js
          node --check public/app.js
          node --check netlify/functions/health.js
          node --check scripts/preflight.cjs
          node --check scripts/smoke.mjs
          node --check scripts/issue-pilot-invite.cjs
      - name: Run standalone deployment preflight
        run: npm run preflight
      - name: Run full API, safety, domain and preview regression tests
        run: npm test
